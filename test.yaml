# 官方示例：https://github.com/MetaCubeX/mihomo/blob/Meta/docs/config.yaml
# 运行模式
mode: rule
keep-alive-interval: 15
keep-alive-idle: 15
# 缓存
profile:
  store-selected: true
  store-fake-ip: true
# 统一延迟
unified-delay: true
# TCP 并发
tcp-concurrent: true
# GEOIP 数据模式
geodata-mode: true
# 自动更新 GEO
geo-auto-update: true
geo-update-interval: 24
# 自定义 GEO 下载地址
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat"

# DNS 配置
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - rule-set:fakeip-filter
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

# 域名嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8081]
      override-destination: true
    TLS:
      ports: [443]
    QUIC:
      ports: [443]
  skip-domain:
    - Mijia Cloud

rule-providers:
  # fake-ip 过滤（自维护）
  fakeip-filter:
    type: http
    behavior: domain
    format: text
    url: "https://raw.githubusercontent.com/ccalm952/ccalm-rules/main/fake_ip_filter.list"
    path: ./ruleset/fakeip-filter.list
    interval: 86400

rules:
  # 自定义直连
  - DOMAIN-SUFFIX,ccalm.xyz,DIRECT
  - DOMAIN-SUFFIX,lichidental.com,DIRECT
  - DOMAIN-SUFFIX,yutoons.com,DIRECT
  - DOMAIN-SUFFIX,mmm920.com,DIRECT

  # 自建服务器 IP
  - IP-CIDR,38.55.195.82/32,DIRECT,no-resolve
  - IP-CIDR,38.55.96.234/32,DIRECT,no-resolve
  - IP-CIDR,198.46.175.234/32,DIRECT,no-resolve

  # 自定义代理
  - DOMAIN-SUFFIX,store.bblcdn.com,香港节点
  - DOMAIN-SUFFIX,iyf.tv,香港节点
  - DOMAIN-SUFFIX,agedm.vip,香港节点
  - DOMAIN-SUFFIX,xifanacg.com,香港节点
  - DOMAIN-SUFFIX,sidestore.io,手动选择

  # Loyalsoldier 白名单
  # https://github.com/Loyalsoldier/v2ray-rules-dat
  # GEOSITE → geox-url.geosite
  - GEOSITE,tld-cn,DIRECT
  - GEOSITE,category-games@cn,DIRECT
  - GEOSITE,category-ai-!cn,AI
  - GEOSITE,geolocation-!cn,手动选择
  - GEOSITE,cn,DIRECT
  - GEOSITE,private,DIRECT

  # GEOIP → geox-url.geoip
  - GEOIP,CN,DIRECT,no-resolve
  - GEOIP,PRIVATE,DIRECT,no-resolve
  - MATCH,手动选择

proxy-groups:
  - name: 手动选择
    type: select
    proxies:
      - 香港节点
      - 美国节点

  - name: AI
    type: select
    proxies:
      - 美国节点
      - 香港节点
      - DIRECT

  - name: 香港节点
    type: url-test
    include-all: true
    filter: "香港"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 美国节点
    type: url-test
    include-all: true
    filter: "美国"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
