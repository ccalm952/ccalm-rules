# 状态持久化 → cache.db
profile:
  store-selected: true   # 保留策略组选中节点
  store-fake-ip: true    # 保留 fake-IP 映射

mode: rule
tcp-concurrent: true

# Loyalsoldier geo 库
# 参考：https://github.com/Loyalsoldier/v2ray-rules-dat
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/Country.mmdb"
geo-auto-update: true
geo-update-interval: 24

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - rule-set:fakeip-filter
  default-nameserver:   # 纯 IP，引导解析 DoH 域名
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

# Loyalsoldier clash-rules
# 参考：https://github.com/Loyalsoldier/clash-rules

rule-providers:
  # fake-ip 过滤
  fakeip-filter:
    type: http
    behavior: domain
    format: text
    url: "https://raw.githubusercontent.com/juewuy/ShellCrash/dev/public/fake_ip_filter.list"
    path: ./ruleset/fakeip-filter.list
    interval: 86400

  proxy:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"
    path: ./ruleset/loyalsoldier/proxy.yaml
    interval: 86400

  direct:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
    path: ./ruleset/loyalsoldier/direct.yaml
    interval: 86400

rules:
  # 自定义直连
  - DOMAIN-SUFFIX,ccalm.xyz,DIRECT
  - DOMAIN-SUFFIX,lichidental.com,DIRECT
  - DOMAIN-SUFFIX,yutoons.com,DIRECT
  - DOMAIN-SUFFIX,mmm920.com,DIRECT
  # 自建服务器 IP
  - IP-CIDR,38.55.195.82/32,DIRECT,no-resolve
  - IP-CIDR,38.55.96.234/32,DIRECT,no-resolve
  - IP-CIDR,198.46.175.234/32,DIRECT,no-resolve

  # 自定义代理
  - DOMAIN-SUFFIX,store.bblcdn.com,香港节点
  - DOMAIN-SUFFIX,iyf.tv,香港节点

  # Loyalsoldier 白名单模式 + geosite 补充
  # 下列 GEOSITE/GEOIP 均来自上方 geox-url 的 geosite.dat / geoip.dat
  # private
  # https://github.com/v2fly/domain-list-community/blob/master/data/private
  - GEOSITE,private,DIRECT
  # category-ads-all
  # https://github.com/v2fly/domain-list-community/blob/master/data/category-ads-all
  - GEOSITE,category-ads-all,REJECT
  # steam@cn
  # https://github.com/v2fly/domain-list-community/blob/master/data/steam
  - GEOSITE,steam@cn,DIRECT
  # icloud
  # https://github.com/v2fly/domain-list-community/blob/master/data/icloud
  - GEOSITE,icloud,DIRECT
  # apple-cn
  # https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/apple-cn.txt
  - GEOSITE,apple-cn,DIRECT
  # google-cn
  # https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/google-cn.txt
  - GEOSITE,google-cn,DIRECT
  # category-ai-!cn
  # https://github.com/v2fly/domain-list-community/blob/master/data/category-ai-!cn
  - GEOSITE,category-ai-!cn,AI
  # microsoft
  # https://github.com/v2fly/domain-list-community/blob/master/data/microsoft
  - GEOSITE,microsoft,微软服务
  # proxy
  # https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt
  - RULE-SET,proxy,手动选择
  # direct
  # https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt
  - RULE-SET,direct,DIRECT
  # telegram
  # https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat
  - GEOIP,telegram,手动选择,no-resolve
  # LAN
  # 内核内置局域网/保留地址
  - GEOIP,LAN,DIRECT,no-resolve
  # CN
  # https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,漏网之鱼

proxy-groups:
  - name: 手动选择
    type: select
    proxies:
      - 香港节点
      - 美国节点
  - name: 微软服务
    type: select
    proxies:
      - DIRECT
      - 香港节点
      - 美国节点
      - 手动选择
  - name: AI
    type: select
    proxies:
      - 美国节点
      - 香港节点
      - DIRECT
  - name: 漏网之鱼
    type: select
    proxies:
      - 香港节点
      - 美国节点
      - DIRECT
  - name: 香港节点
    type: url-test
    include-all: true
    filter: '香港'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
  - name: 美国节点
    type: url-test
    include-all: true
    filter: '美国'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
