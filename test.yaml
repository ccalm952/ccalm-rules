# 状态持久化 → cache.db
profile:
  store-selected: true # 保留策略组选中节点
  store-fake-ip: true # 保留 fake-IP 映射

mode: rule
tcp-concurrent: true

# Loyalsoldier geo 库
# 参考：https://github.com/Loyalsoldier/v2ray-rules-dat
geodata-mode: true
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/Country.mmdb"
geo-auto-update: true
geo-update-interval: 24

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - rule-set:fakeip-filter
  default-nameserver: # 纯 IP，引导解析 DoH 域名
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

# 域名嗅探
sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: true
  sniff:
    # 未写 ports 时 TLS 默认 443，HTTP 默认 80
    TLS: {}
    HTTP: {}
  skip-domain:
    # Mijia Cloud 是特殊 SNI，不能用 +.mi.com 替代
    - Mijia Cloud
    - "+.push.apple.com"
    - "+.mi.com"
    - "+.oray.com"

rule-providers:
  # fake-ip 过滤
  fakeip-filter:
    type: http
    behavior: domain
    format: text
    url: "https://raw.githubusercontent.com/juewuy/ShellCrash/dev/public/fake_ip_filter.list"
    path: ./ruleset/fakeip-filter.list
    interval: 86400

rules:
  # 自定义直连
  - DOMAIN-SUFFIX,ccalm.xyz,DIRECT
  - DOMAIN-SUFFIX,lichidental.com,DIRECT
  - DOMAIN-SUFFIX,yutoons.com,DIRECT
  - DOMAIN-SUFFIX,mmm920.com,DIRECT

  # 自建服务器 IP
  - IP-CIDR,38.55.195.82/32,DIRECT,no-resolve
  - IP-CIDR,38.55.96.234/32,DIRECT,no-resolve
  - IP-CIDR,198.46.175.234/32,DIRECT,no-resolve

  # 自定义代理
  - DOMAIN-SUFFIX,store.bblcdn.com,香港节点
  - DOMAIN-SUFFIX,iyf.tv,香港节点

  # Loyalsoldier 白名单模式
  # GEOSITE → geox-url.geosite
  # https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat
  - GEOSITE,private,DIRECT
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,steam@cn,DIRECT
  - GEOSITE,category-ai-!cn,AI
  - GEOSITE,geolocation-!cn,手动选择
  - GEOSITE,cn,DIRECT

  # GEOIP → geox-url.geoip
  # https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat
  - GEOIP,private,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,漏网之鱼

proxy-groups:
  - name: 手动选择
    type: select
    proxies:
      - 香港节点
      - 美国节点

  - name: AI
    type: select
    proxies:
      - 美国节点
      - 香港节点
      - DIRECT

  - name: 漏网之鱼
    type: select
    proxies:
      - 香港节点
      - 美国节点
      - DIRECT

  - name: 香港节点
    type: url-test
    include-all: true
    filter: "香港"
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50

  - name: 美国节点
    type: url-test
    include-all: true
    filter: "美国"
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
